:root{--bg:#0B0C10;--s1:#14161C;--s2:#1C1F27;--hair:rgba(255,255,255,.1);--ink:#F5F6F8;--ink2:#BAC0CB;--ink3:#8D96A6;--green:#3DDC84;--red:#FF6B7A;--gold:#F2C94C;--ease:cubic-bezier(.22,1,.36,1);--col:560px;--tabh:60px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#050608;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Geist,Arial,sans-serif;font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
b,strong,h1,h2,h3,h4,h5{font-weight:500}
h2,h3,h4,h5,p{margin:0}
small{font-size:12px;color:var(--ink3)}
em{font-style:normal}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.pos{color:var(--green)}.neg{color:var(--red)}.dim{color:var(--ink3);font-size:13px}
.cap{margin-top:10px;font-size:12px;line-height:1.4}
.hint{margin:10px 0 14px;font-size:12px;color:var(--ink3)}
.shell{max-width:var(--col);margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(11,12,16,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.brand{display:flex;gap:10px;align-items:baseline}
.brand>div{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:26px;letter-spacing:-.045em;line-height:1}
.brand small{letter-spacing:.02em}
.ball{display:none}
.live{display:inline-flex;gap:7px;align-items:center;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.live i,.pulse,.game em.live i,.liveq i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.view{padding:0 0 calc(var(--tabh) + 28px + env(safe-area-inset-bottom));outline:0}
.sec{padding:30px 16px 6px;border-top:1px solid var(--hair)}
.sec:first-child{border-top:0;padding-top:22px}
.sec-h{margin:0 0 16px}
.sec-h small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.sec h2{font-size:30px;letter-spacing:-.035em;line-height:1.08}
.sub-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:24px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:8px;background:var(--s2);border:1px solid var(--hair);font-weight:500;font-size:14px}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.on{background:var(--ink);color:#0A0B0E}
.btn.round{width:44px;height:44px;padding:0;border-radius:50%;background:var(--ink);color:#0A0B0E;flex:none}
.btn.round svg{width:18px;height:18px;fill:currentColor}
.btn.round svg .pp{d:path("M8 5v14l11-7z")}
.btn.round.on svg .pp{d:path("M7 5h4v14H7zM13 5h4v14h-4z")}
.lnk{font-weight:500;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
button:not(:disabled):active{transform:scale(.985)}
.cmpbar{margin:-4px 0 14px}

/* underline tabs */
.ut{display:flex;border-bottom:1px solid var(--hair);margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.ut::-webkit-scrollbar{display:none}
.ut button{flex:none;padding:10px 14px;font-size:14px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.ut.sm button{padding:9px 12px;font-size:13px}
.ut button.on{color:var(--ink);border-bottom-color:var(--tc,var(--ink))}

/* avatars */
.av{display:inline-block;flex:none;width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:#15171D center/cover no-repeat;box-shadow:0 0 0 2px var(--tc,#444);vertical-align:middle}
.av.ghost{background:var(--s2);box-shadow:0 0 0 2px var(--hair)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:var(--col);z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding:0 8px env(safe-area-inset-bottom);background:rgba(11,12,16,.96);backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--ink3);font-size:11px;font-weight:500;position:relative}
.tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--ink)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}

/* headlines */
.stories{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:min(74%,250px);scroll-snap-align:start;scroll-margin-left:16px;padding:2px 18px 4px 16px;border-left:1px solid var(--hair);display:flex;flex-direction:column;gap:6px}
.story:first-child{padding-left:0;border-left:0}
.story .k{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);display:flex;gap:7px;align-items:center}
.story .pulse{color:var(--green)}
.story .big{font-size:52px;font-weight:500;letter-spacing:-.05em;line-height:1;color:var(--tc)}
.story .h{font-size:15px;font-weight:500;line-height:1.3}
.story .sub{font-size:12px;color:var(--ink3)}

/* scoreboard */
.wstrip{display:flex;align-items:center;overflow-x:auto;margin:0 -16px 6px;padding:0 10px 0 16px;scrollbar-width:none;border-bottom:1px solid var(--hair)}
.wstrip::-webkit-scrollbar{display:none}
.wstrip small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-right:8px;flex:none}
.wstrip button{flex:none;min-width:34px;padding:11px 8px;text-align:center;font-size:15px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.wstrip button.next{font-style:italic}
.wstrip button.on{color:var(--ink);border-bottom-color:var(--ink)}
.board{display:grid}
.game{display:block;width:100%;padding:16px 0 14px;border-bottom:1px solid var(--hair)}
.game>em{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.game>em.live{color:var(--green)}
.gr{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 8px;border-radius:8px;margin-bottom:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 26%,transparent),transparent 72%)}
.gr .n{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.gr .n b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .n small{font-size:12px}
.gr .sc{font-size:26px;font-weight:500;letter-spacing:-.03em}
.gr.lose{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 8%,transparent),transparent 60%);color:var(--ink3)}
.gr.lose .av{opacity:.5}
.gr.lose .n b{font-weight:400}

/* awards */
.awards{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px}
.aw{display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:2px solid var(--tc);text-align:left}
.aw small:first-child{letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.aw .num{font-size:40px;letter-spacing:-.05em;line-height:1.05;color:var(--tc)}
.aw .who{font-size:15px;font-weight:500}

/* race */
.chartwrap{margin:0 -4px}
.bump{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.bump .gl{stroke:rgba(255,255,255,.06);stroke-width:1}
.bump .gl.cut{stroke:rgba(255,255,255,.22);stroke-dasharray:3 5}
.bump .ax{fill:var(--ink3);font-size:11px}
.bump .guide{stroke:rgba(255,255,255,.3);stroke-width:1;stroke-dasharray:2 4;transition:all .45s var(--ease)}
.bump .ln{fill:none;stroke:var(--tc);stroke-width:2.6;stroke-linecap:round;opacity:.6;transition:opacity .25s,stroke-width .25s}
.has-sel .bump .ln{opacity:.1}.has-sel .bump .ln.sel{opacity:1;stroke-width:5}
.bump .pk{transition:transform .55s var(--ease),opacity .25s;cursor:pointer}
.bump .pk .ring{fill:#0B0C10;stroke:var(--tc);stroke-width:2.5}
.has-sel .bump .pk{opacity:.3}.has-sel .bump .pk.sel{opacity:1}
.scrub{display:flex;align-items:center;gap:14px;margin:12px 0 0}
.scrub input{flex:1;accent-color:var(--ink)}
.scrub output{font-size:14px;font-weight:500;min-width:64px;text-align:right}
.standings{position:relative}
.srow{position:absolute;left:0;right:0;top:0;height:52px;display:grid;grid-template-columns:24px 36px 1fr auto 56px;gap:10px;align-items:center;padding:0 4px;border-bottom:1px solid var(--hair);transition:transform .55s var(--ease),opacity .25s,background .25s;width:100%}
.srow .rk{font-size:15px;color:var(--ink3);text-align:center}
.srow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .rc{color:var(--ink2);font-size:14px}
.srow .pf{color:var(--ink3);font-size:13px;text-align:right}
.srow.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,transparent),transparent)}
.has-sel .srow:not(.sel){opacity:.4}
.cutline{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.3);z-index:2;pointer-events:none}
.cutline u{position:absolute;right:0;top:-9px;text-decoration:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--bg);color:var(--ink3);padding:0 6px}
.cutline.in u{color:var(--green)}.cutline.bye u{color:var(--gold)}
.odds{display:grid}
.orow{display:grid;grid-template-columns:104px 1fr 46px;gap:8px;align-items:center;padding:5px 0;width:100%}
.orow .nm{display:flex;gap:8px;align-items:center;min-width:0}
.orow .nm b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .pc{text-align:right;font-weight:500}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.cells span{height:26px;display:grid;place-items:center;font-size:10px;border-radius:3px;background:rgba(255,255,255,.04);position:relative;z-index:0}
.cells span::before{content:"";position:absolute;inset:0;border-radius:3px;background:var(--k);opacity:var(--a);z-index:-1}
.cells .b{--k:var(--gold)}.cells .i{--k:var(--green)}.cells .o{--k:var(--red)}
.orow.oh{padding:0}.orow.oh .cells span{height:auto;background:none;font-size:11px;color:var(--ink3)}
.orow.oh.k .cells{grid-template-columns:2fr 4fr 4fr}
.orow.oh.k .cells span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:4px}
.orow.oh.k .b{color:var(--gold)}.orow.oh.k .i{color:var(--green)}.orow.oh.k .o{color:var(--red)}
.orow.oh .cells span::before{display:none}

/* lists */
.list,.board,.roster,.tb,.odds,.tally{display:grid;grid-template-columns:minmax(0,1fr)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair);position:relative;width:100%}
.item>i{font-style:normal;width:24px;flex:none;text-align:center;color:var(--ink3);font-size:13px}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.item .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small.wrap{white-space:normal}
.item .val{font-weight:500;font-size:18px;letter-spacing:-.02em}
.item .val.sm{font-size:14px;color:var(--ink2);letter-spacing:0}
.item .mv{font-size:12px;font-weight:500;color:var(--ink3);width:38px;text-align:right}
.item .mv.up{color:var(--green)}.item .mv.dn{color:var(--red)}
.item.me{background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
.crowns{display:flex;gap:4px}
.crowns u{width:12px;height:12px;border-radius:50%;background:var(--gold)}

/* teams */
.roster{display:grid}
.tm-row{display:grid;grid-template-columns:26px 54px 1fr auto;gap:12px;align-items:center;padding:12px 10px 12px 4px;border-bottom:1px solid var(--hair);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 26%,transparent),transparent 75%);position:relative}
.tm-row .no{font-style:normal;font-size:20px;letter-spacing:-.04em;color:var(--ink3);text-align:center}
.tm-row .nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tm-row .nm b{font-size:18px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-row .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-row .rr{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.tm-row .rr b{font-size:20px;letter-spacing:-.03em}
.tm-row.picked{box-shadow:inset 3px 0 0 var(--green)}
.tm-row .cn{position:absolute;right:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#06130B;font-weight:500;display:grid;place-items:center;font-size:12px}

/* tables inside sheets */
.tb{display:grid}
.tb .r{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);width:100%;font-size:14px;text-align:left}
.tb .r>span:not(.nm){text-align:right}
.tb .r>span:first-child:not(.nm){text-align:left}
.tb .r.h{padding:6px 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.tb .nm{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.tb .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.plain small{margin-left:4px}
.tb .r.sch .wk{color:var(--ink3);font-size:13px;text-align:left}
.tb .r.sch .res{text-align:center;font-weight:500}
.tb:has(.r:nth-child(2)>.nm:nth-child(2)) .r.h>span:nth-child(2){text-align:left}
.tpick{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 14px;margin:0 -16px;scrollbar-width:none}
.tpick::-webkit-scrollbar{display:none}
.tpick button{flex:none;padding:3px;border-radius:50%;opacity:.45;transition:opacity .15s}
.tpick button.on{opacity:1;background:var(--tc)}
.tpick button .av{box-shadow:none}

/* heat grids */
.sgrid,.rgrid{display:grid;gap:2px}
.sg-h,.sg-r,.rg-h,.rg-r{display:grid;gap:2px;align-items:center}
.sg-h,.sg-r{grid-template-columns:28px repeat(11,minmax(0,1fr))}
.rg-h,.rg-r{grid-template-columns:28px repeat(10,minmax(0,1fr))}
.sg-h span,.rg-h span{text-align:center;font-size:10px;color:var(--ink3);display:grid;place-items:center}
.rl{display:grid;place-items:center}
.sgrid .sc,.rgrid .rc{height:32px;border-radius:3px;font-size:10px;font-weight:500;display:grid;place-items:center;background:rgba(255,255,255,.04);padding:0}
.rgrid .rc.self{background:transparent}

/* legacy */
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{flex:none;width:188px;scroll-snap-align:start;scroll-margin-left:16px;padding:16px 14px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-radius:6px;background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 52%,#0B0C10),#0B0C10 78%);border-top:3px solid var(--tc)}
.banner .yr{font-size:44px;letter-spacing:-.05em;line-height:1}
.banner .crown{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:500;margin-bottom:8px}
.banner h3{font-size:17px;line-height:1.2;margin-top:8px;letter-spacing:-.015em}
.banner p{font-size:13px;color:var(--ink2)}
.banner .bl{display:grid;gap:6px;width:100%;margin-top:auto;padding-top:12px;font-size:12px}
.banner .bl span{display:flex;flex-direction:column}.banner .bl small{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.banner .pun{font-size:11px;line-height:1.3;color:var(--ink2);font-style:italic}
.md{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--s2);border:1px solid var(--hair);line-height:1.1}
.md b{font-size:16px}.md small{font-size:10px}
.md.g{background:#3A3010;border-color:#B8962E;color:#F2D067}
.md.s{background:#26292F;border-color:#8C94A3}
.md.b{background:#33231A;border-color:#A06A44}
.medals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

/* lab */
.karma{width:100%;height:auto;display:block}
.karma .gl{stroke:rgba(255,255,255,.07)}.karma .ax{fill:var(--ink3);font-size:11px}
.karma .diag{stroke:rgba(255,255,255,.3);stroke-dasharray:4 5}
.karma .zone{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}.karma .zone.up{fill:var(--green)}.karma .zone.dn{fill:var(--red)}
.karma .kn{cursor:pointer}.karma .kn .ring{fill:#0B0C10;stroke:var(--tc);stroke-width:2.5}.karma .kn.sel .ring{stroke-width:5}
.dotinfo{margin-top:8px;font-size:13px;color:var(--ink2);min-height:20px}
.tally{display:grid}
.ty{display:grid;grid-template-columns:28px 72px 1fr 24px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
.ty b{font-size:14px}
.ty .dots{display:flex;gap:4px;flex-wrap:wrap}
.ty .dots u{width:11px;height:11px;border-radius:50%;background:var(--tc)}
.ty em{text-align:right;font-weight:500}
details.case{border-bottom:1px solid var(--hair);padding:10px 0}
details summary{cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details.case summary{display:flex;gap:10px;align-items:center}
details.case .wk{width:38px;font-size:12px;color:var(--ink3)}
details.case .nm{display:flex;flex-direction:column;line-height:1.25;min-width:0;color:var(--ink)}
details.case .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
details.case h5{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
details.case .cols span{display:flex;gap:6px;justify-content:space-between;font-size:13px;padding:2px 0}
details.case .cols span small{margin-left:auto}
details.case p{margin-top:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open{overflow:hidden}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:var(--col);height:86vh;max-height:calc(100dvh - 24px);z-index:70;background:var(--bg);border-radius:18px 18px 0 0;border:1px solid var(--hair);border-bottom:0;transform:translateY(106%);transition:transform .4s var(--ease);display:flex;flex-direction:column}
.sheet.tall{height:92vh}
.sheet.on{transform:none}
.grab{height:24px;flex:none;touch-action:none;cursor:grab;display:grid;place-items:center}
.grab::before{content:"";width:38px;height:4px;border-radius:9px;background:rgba(255,255,255,.2)}
.sheet .x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--s2);font-size:22px;line-height:1;display:grid;place-items:center;color:var(--ink2);z-index:2}
.sheet-body{overflow:auto;padding:4px 16px 40px;flex:1;overscroll-behavior:contain}
.sheet h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:26px 0 8px}
.sheet .ph{font-size:20px;margin:6px 0 16px;letter-spacing:-.02em}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.pickgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.actions{display:flex;gap:10px;margin-top:22px}
.dh{display:flex;gap:16px;align-items:center;padding:6px 0 16px}
.dh h3{font-size:26px;letter-spacing:-.035em;line-height:1.1}
.dh p{font-size:13px;color:var(--ink2);margin-top:4px}
.tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tc);border:1px solid var(--tc);padding:3px 8px;border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 0 4px}
.kpis span{display:flex;flex-direction:column;gap:2px}
.kpis b{font-size:24px;letter-spacing:-.04em;line-height:1.1}
.kpis small{font-size:11px}
.glog{width:100%;height:auto;display:block;overflow:visible}
.glog .avg{stroke:rgba(255,255,255,.22);stroke-dasharray:3 5}
.glog .gl2{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.5}
.glog .gd{cursor:pointer}
.glog .gd.w circle{fill:var(--tc)}.glog .gd.l circle{fill:var(--bg);stroke:var(--tc);stroke-width:2.5}
.glog .ax{fill:var(--ink3);font-size:10px}
.seeds{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seeds span{display:flex;flex-direction:column;align-items:center;padding:7px 0 5px;border-radius:4px;background:rgba(255,255,255,.04);position:relative;overflow:hidden}
.seeds span::before{content:"";position:absolute;inset:0;background:var(--k);opacity:var(--a)}
.seeds .b{--k:var(--gold)}.seeds .i{--k:var(--green)}.seeds .o{--k:var(--red)}
.seeds b,.seeds small{position:relative;font-size:12px}.seeds small{font-size:10px;min-height:12px;color:var(--ink)}
.pbars{display:grid;gap:10px}
.pb{display:grid;grid-template-columns:34px 1fr 74px;gap:10px;align-items:center}
.pn{font-size:12px;font-weight:500;color:var(--ink3)}
.track{position:relative;height:12px;background:rgba(255,255,255,.04);border-radius:3px}
.track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.35)}
.track u{position:absolute;top:0;bottom:0;border-radius:3px}
.track u.up{background:var(--tc)}.track u.dn{background:var(--red);opacity:.8}
.pv{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.pv small{font-size:12px}

/* matchup */
.mh{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;padding:6px 0 12px}
.mside{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mside b{font-size:13px;color:var(--ink2)}
.ms{font-size:36px;font-weight:500;letter-spacing:-.04em;line-height:1;color:var(--ink2)}
.mside.win .ms,.mside.win b{color:var(--ink)}
.mvs{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--ink3);font-weight:500;text-transform:uppercase}
.liveq{color:var(--green);display:inline-flex;gap:5px;align-items:center}
.split{display:flex;gap:2px;height:4px;margin:0 0 16px}
.split u{display:block;height:100%;background:var(--tc);border-radius:2px}
.lineup{border-top:1px solid var(--hair)}
.lrow{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair);gap:6px}
.pl{display:flex;justify-content:space-between;gap:8px;min-width:0;color:var(--ink3);font-size:13px}
.pl b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400}
.pl em{font-weight:500}
.pl:last-child{flex-direction:row-reverse}
.pl.hi{color:var(--ink)}
.slot{text-align:center;font-size:10px;letter-spacing:.06em;color:var(--ink3);font-weight:500}
.lrow.tot .pl{font-size:16px;color:var(--ink2)}.lrow.tot .pl.hi{color:var(--ink)}
.lrow.perf .pl{font-size:12px}
.note{margin-top:14px;padding:4px 0 4px 12px;border-left:3px solid var(--red);font-size:14px}
.left{margin-top:14px;display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.left b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.left>span{display:flex;gap:8px;align-items:center}
details.more{margin-top:14px}
.benchrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;font-size:12px;color:var(--ink3)}

/* tape */
.th{display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;padding:6px 0 14px}
.tside{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.tside b{font-size:15px}
.tvs{text-align:center;color:var(--ink3);font-size:12px}
.meet{text-align:center;font-size:13px;color:var(--ink2);margin-bottom:10px}
.series{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:10px 0 14px;border-top:1px solid var(--hair)}
.series b{font-size:52px;letter-spacing:-.05em;line-height:1}
.series span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:0 8px}
.sdots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sd{width:14px;height:14px;border-radius:50%;background:var(--tc)}

"use strict";
const D = DATA, T = D.teams, G = D.week, REG = D.regMP;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const sgn = (n, d = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(d);
const pct = n => n >= 99.95 ? "100%" : n < 0.05 ? "0%" : n >= 99 ? ">99%" : n < 1 ? "<1%" : Math.round(n) + "%";
const NAME = { 0: "QB", 2: "RB", 4: "WR", 6: "TE", 16: "DST", 17: "K", 23: "FLEX", 20: "BN", 21: "IR" };
const SLOT_ORDER = { 0: 0, 2: 1, 4: 3, 6: 5, 23: 6, 16: 7, 17: 8 };
const POSN = { 1: "QB", 2: "RB", 3: "WR", 4: "TE", 5: "K", 16: "DST" };
const POSL = ["QB", "RB", "WR", "TE", "K", "DST"];
const nm = t => esc(T[t].name);
const sh = t => esc(T[t].short);
const cl = t => T[t].color;
const poss = n => /s$/i.test(n) ? n + "’" : n + "’s";
const rec = t => T[t].w + "–" + T[t].l;
const recAt = (t, w) => T[t].recs[Math.min(w, G) - 1].join("–");
const tidOf = o => D.ownerTid[o];

document.head.insertAdjacentHTML("beforeend", "<style>" + IDS.map(t =>
  `.t${t}{--tc:${T[t].color}}.lg${t}{background-image:url("${T[t].logo}")}`).join("") + "</style>");
const av = (t, s = 36) => t && T[t] ? `<span class="av lg${t} t${t}" style="--s:${s}px"></span>` : `<span class="av ghost" style="--s:${s}px"></span>`;

// ---------- sheet ----------
const sheet = $("#sheet"), scrim = $("#scrim"), sbody = $("#sheetBody");
let lastFocus = null;
function openSheet(html, cls = "") {
  lastFocus = document.activeElement;
  sbody.innerHTML = html;
  sheet.className = "sheet " + cls;
  document.body.classList.add("sheet-open");
  requestAnimationFrame(() => sheet.classList.add("on"));
  sbody.scrollTop = 0;
  $("#sheetX").focus({ preventScroll: true });
}
function closeSheet() {
  sheet.classList.remove("on");
  document.body.classList.remove("sheet-open");
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
scrim.addEventListener("click", closeSheet);
$("#sheetX").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
(() => {
  const g = $("#grab"); let y0 = null;
  g.addEventListener("pointerdown", e => { y0 = e.clientY; g.setPointerCapture(e.pointerId); sheet.style.transition = "none"; });
  g.addEventListener("pointermove", e => { if (y0 != null) sheet.style.transform = `translateY(${Math.max(0, e.clientY - y0)}px)`; });
  const end = e => { if (y0 == null) return; const dy = e.clientY - y0; y0 = null; sheet.style.transition = ""; sheet.style.transform = ""; if (dy > 90) closeSheet(); };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
})();

// ---------- state + routing ----------
const TABS = [
  ["scores", "Scores", '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 12h16"/>'],
  ["race", "Race", '<path d="M3 17c4 0 4-10 9-10s5 10 9 10"/>'],
  ["teams", "Teams", '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>'],

  ["lab", "Lab", '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'],
];
const S = { tab: "scores", week: G, scrub: G, sel: null, compare: false, cmp: [], recKey: "high", swapT: "2", pane: "over" };
let tick = null;
$("#tabs").innerHTML = TABS.map(([k, l, ic]) => `<button role="tab" data-tab="${k}" aria-label="${l}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg><span>${l}</span></button>`).join("");
$("#stamp").textContent = "Week " + G + " · " + D.date.replace(/, \d{4}$/, "");
$("#status").innerHTML = D.prelim ? '<span class="live"><i></i>Live</span>' : "";
function stopTick() { if (tick) { clearInterval(tick); tick = null; } const b = $("#play"); if (b) b.classList.remove("on"); }

function go(tab, push = true) {
  if (!TABS.some(t => t[0] === tab)) tab = "scores";
  closeSheet(); stopTick();
  S.tab = tab;
  $$("#tabs button").forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  const v = $("#view");
  v.innerHTML = VIEWS[tab]();
  v.className = "view v-" + tab;
  if (tab === "race") applySel();
  window.scrollTo(0, 0);
  if (push) history.replaceState(null, "", "#" + tab);
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });

const sec = (kicker, title, inner) => `<section class="sec"><div class="sec-h"><small>${kicker}</small><h2>${title}</h2></div>${inner}</section>`;
const picker = (cur, act) => `<div class="tpick">${IDS.map(t => `<button class="${cur === t ? "on" : ""} t${t}" data-act="${act}" data-t="${t}" aria-label="${esc(T[t].name)}">${av(t, 38)}</button>`).join("")}</div>`;
const ranked = () => IDS.slice().sort((a, b) => T[a].ranks[G - 1] - T[b].ranks[G - 1]);
const gameIdx = (w, t) => (D.sched[w] || []).findIndex(g => g.h === t || g.a === t);

// ================= SCORES =================
function storyHTML(s, i) {
  return `<button class="story t${s.t[0]}" data-act="story" data-i="${i}">
    <span class="k">${s.live ? '<i class="pulse"></i>' : ""}${esc(s.k)}</span>
    <span class="big">${esc(s.big)}</span>
    <span class="h">${esc(s.h)}</span>
    <span class="sub">${esc(s.sub)}</span></button>`;
}
function gameHTML(w, g, i) {
  const fut = w > G, open = g.open != null && w === G;
  const hW = !fut && g.hp > g.ap, aW = !fut && g.ap > g.hp;
  const row = (t, pts, win, proj) => `<span class="gr t${t} ${win ? "win" : !fut ? "lose" : ""}">${av(t, 40)}<span class="n"><b>${nm(t)}</b><small>${fut ? rec(t) : recAt(t, w)} · ${esc(T[t].owner)}</small></span><span class="sc">${fut ? (proj != null ? f1(proj) : "") : f1(pts)}</span></span>`;
  let st;
  if (fut) st = g.ph != null ? `<em>${sh(g.h)} ${g.ph}% to win</em>` : "<em>Upcoming</em>";
  else if (open) st = `<em class="live"><i></i>Live · ${sh(g.open > .5 ? g.h : g.a)} ${Math.round(Math.max(g.open, 1 - g.open) * 100)}% to win</em>`;
  else st = `<em>Final · ${f1(Math.abs(g.hp - g.ap))} pt margin</em>`;
  return `<button class="game ${open ? "is-live" : ""}" data-act="match" data-w="${w}" data-i="${i}">${st}${row(g.h, g.hp, hW, g.ph_proj)}${row(g.a, g.ap, aW, g.pa_proj)}</button>`;
}
function awardsHTML(w) {
  const pl = [];
  IDS.forEach(t => D.lineups[w][t].forEach(p => pl.push({ t, n: p[0], pos: p[1], slot: p[2], pts: p[3], proj: p[4] })));
  const st = pl.filter(p => p.slot !== 20 && p.slot !== 21), bn = pl.filter(p => p.slot === 20);
  const mvp = st.reduce((a, b) => b.pts > a.pts ? b : a);
  const bust = st.filter(p => p.proj >= 10).reduce((a, b) => (b.pts - b.proj) < (a.pts - a.proj) ? b : a);
  const boom = st.filter(p => p !== mvp).reduce((a, b) => (b.pts - b.proj) > (a.pts - a.proj) ? b : a);
  const wasted = bn.reduce((a, b) => b.pts > a.pts ? b : a);
  const blk = (k, p, num, line) => `<button class="aw t${p.t}" data-act="team" data-t="${p.t}"><small>${k}</small><b class="num">${num}</b><span class="who">${esc(p.n)}</span><small>${line}</small></button>`;
  return `<div class="awards">${blk("Player of the week", mvp, f1(mvp.pts), sh(mvp.t) + " · " + POSN[mvp.pos])}

    <div class="series"><b style="color:${cl(a)}">${hh[0]}</b><span>All-time record</span><b style="color:${cl(b)}">${hh[1]}</b></div>
    ${dots ? `<div class="sdots">${dots}</div><p class="dim cap">One dot per meeting, oldest first.${big ? " Biggest margin " + f1(Math.abs(big[2] - big[3])) + " (" + big[0] + ")." : ""}</p>` : ""}
    <div class="cmp">${cmp("Record", A.w, B.w, true, rec(a), rec(b))}${cmp("Points", A.pf, B.pf, true, Math.round(A.pf).toLocaleString(), Math.round(B.pf).toLocaleString())}${cmp("Points against", A.pa, B.pa, false, Math.round(A.pa).toLocaleString(), Math.round(B.pa).toLocaleString())}
      ${cmp("Playoff odds", A.odds, B.odds, true, pct(A.odds), pct(B.odds))}${cmp("Titles", ca.titles.length, cb.titles.length, true, ca.titles.length, cb.titles.length)}${cmp("All-time win rate", ca.win_pct, cb.win_pct, true, Math.round(ca.win_pct * 100) + "%", Math.round(cb.win_pct * 100) + "%")}</div>
    ${games.length ? `<h4>Meetings</h4><div class="tb plain" style="--cols:86px 1fr 90px">${log}</div>` : ""}`, "tall");
}

// ================= LEGACY =================
function banner(s) {
  const c = s.champ, t = c.tid;
  return `<article class="banner ${t ? "t" + t : ""}" ${t ? "" : 'style="--tc:#8A93A0"'}>
    <b class="yr">${s.y}</b><span class="crown">Champion</span>${av(t, 64)}<h3>${esc(c.team)}</h3><p>${esc(c.owner)}</p>
    <div class="bl"><span><small>Runner-up</small>${esc(s.second.owner)}</span><span><small>Last place</small>${esc(s.last.owner)}</span></div>
    ${s.pun ? `<div class="pun">${esc(s.pun.what.length > 70 ? s.pun.what.slice(0, 68) + "…" : s.pun.what)}</div>` : ""}</article>`;
}
function nowBanner() {
  const t = ranked()[0];
  return `<article class="banner now t${t}"><b class="yr">2026</b><span class="crown">In progress</span>${av(t, 64)}<h3>${nm(t)}</h3><p>Leads at ${rec(t)}</p><div class="bl"><span><small>Week</small>${G} of ${REG}</span></div></article>`;
}
function rivalGrid() {
  const ord = IDS.slice().sort((a, b) => D.career[b].win_pct - D.career[a].win_pct);
  let s = `<div class="rgrid"><div class="rg-h"><span></span>${ord.map(t => `<span>${av(t, 24)}</span>`).join("")}</div>`;
  ord.forEach(a => {
    s += `<div class="rg-r"><span class="rl">${av(a, 24)}</span>` + ord.map(b => {
      if (a === b) return `<span class="rc self"></span>`;
      const h = D.h2h[a][b]; if (!h) return `<span class="rc"></span>`;
      const w = h[0], l = h[1], f = w / Math.max(1, w + l), d = f - .5, col = d >= 0 ? "var(--green)" : "var(--red)";
      return `<button class="rc" data-act="tape" data-a="${a}" data-b="${b}" style="background:color-mix(in srgb,${col} ${Math.round(Math.min(.85, Math.abs(d) * 1.7) * 100)}%,transparent)">${w}–${l}</button>`;
    }).join("") + `</div>`;
  });
  return s + `</div><p class="dim cap">Row team’s all-time record against the column team. Green = winning series. Sorted by all-time win rate. Tap a cell for the full series.</p>`;
}
const RECS = [["high", "High scores"], ["low", "Low scores"], ["blow", "Blowouts"], ["close", "Closest"], ["total", "Shootouts"]];
function recChips() { return `<div class="ut sm" id="recchips">${RECS.map(([k, l]) => `<button class="${S.recKey === k ? "on" : ""}" data-act="rec" data-k="${k}">${l}</button>`).join("")}</div>`; }
function recList(k) {
  return `<div class="list">` + D.records[k].map((r, i) => {
    const solo = k === "high" || k === "low";
    const who = solo ? esc(r.o) + " vs " + esc(r.vs) : esc(r.a) + " over " + esc(r.b);
    const val = solo ? f1(r.pts) : k === "total" || k === "close" ? f1(r.m) : "+" + f1(r.m);
    return `<div class="item flat"><i>${i + 1}</i>${av(tidOf(solo ? r.o : r.a), 34)}<span class="nm"><b>${who}</b><small>${r.y} · Week ${r.w}${solo ? "" : " · " + f1(r.pa) + "–" + f1(r.pb)}</small></span><span class="val">${val}</span></div>`;
  }).join("") + `</div>`;
}
function ladder() {
  const rows = IDS.slice().sort((a, b) => D.career[b].titles.length - D.career[a].titles.length || D.career[b].win_pct - D.career[a].win_pct);
  return `<div class="list">` + rows.map((t, i) => { const c = D.career[t]; return `<button class="item t${t}" data-act="team" data-t="${t}"><i>${i + 1}</i>${av(t, 34)}<span class="nm"><b>${esc(T[t].owner)}</b><small>${c.w}–${c.l} · ${Math.round(c.win_pct * 100)}% all-time</small></span><span class="crowns">${c.titles.map(() => "<u></u>").join("")}</span></button>`; }).join("") + `</div>`;
}
function viewLegacy() {
  return sec("Eight seasons", "Champions", `<div class="banners">${nowBanner()}${D.seasons.slice().reverse().map(banner).join("")}</div>`) +
    sec("Head to head", "Every rivalry", rivalGrid()) +
    sec("Record book", "The extremes", recChips() + `<div id="reclist">${recList(S.recKey)}</div>`) +
    sec("All-time", "The ladder", ladder());
}

// ================= LAB =================
function scoreGrid() {
  const sd = D.sd || 20, avg = D.avg;
  const hd = `<div class="sg-h"><span></span>${Array.from({ length: G }, (_, i) => `<span>${i + 1}</span>`).join("")}</div>`;
  return `<div class="sgrid">${hd}${ranked().map(t => `<div class="sg-r t${t}"><span class="rl">${av(t, 24)}</span>${T[t].scores.map((v, k) => {
    const z = (v - avg) / sd, col = z >= 0 ? "var(--green)" : "var(--red)", i = gameIdx(k + 1, t);
    return `<button class="sc" data-act="match" data-w="${k + 1}" data-i="${i}" style="background:color-mix(in srgb,${col} ${Math.round(Math.min(.8, Math.abs(z) * .5) * 100)}%,transparent)">${Math.round(v)}</button>`;
  }).join("")}</div>`).join("")}</div><p class="dim cap">Every team’s score each week against the league average of ${f1(avg)}. Green = above, red = below. Tap one for the matchup. Teams sorted by current standings.</p>`;
}
function karmaSVG() {
  const W = 400, H = 340, p = { l: 38, r: 16, t: 18, b: 30 };
  const ex = t => (T[t].apw / (T[t].apw + T[t].apl)) * (T[t].w + T[t].l), ys = IDS.map(t => T[t].luck), xs = IDS.map(ex);
  const xlo = Math.floor(Math.min(...xs) - .6), xhi = Math.ceil(Math.max(...xs) + .6), ylo = Math.floor(Math.min(...ys) - .5), yhi = Math.ceil(Math.max(...ys) + .5);
  const x = v => p.l + (v - xlo) / (xhi - xlo) * (W - p.l - p.r), y = v => H - p.b - (v - ylo) / (yhi - ylo) * (H - p.t - p.b);
  let s = `<svg class="karma" viewBox="0 0 ${W} ${H}">`;
  for (let v = ylo; v <= yhi; v++) s += `<line class="gl" x1="${p.l}" x2="${W - p.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${p.l - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" + v : v}</text>`;
  for (let v = xlo; v <= xhi; v++) s += `<text class="ax" x="${x(v)}" y="${H - 10}" text-anchor="middle">${v}</text>`;
  s += `<line class="diag" x1="${p.l}" x2="${W - p.r}" y1="${y(0)}" y2="${y(0)}"/><text class="zone up" x="${p.l + 8}" y="${y(yhi - .15) + 10}">Lucky</text><text class="zone dn" x="${p.l + 8}" y="${y(ylo + .15) - 4}">Robbed</text>`;
  IDS.forEach(t => { s += `<g class="kn t${t}" data-act="karma" data-t="${t}" transform="translate(${x(ex(t))},${y(T[t].luck)})"><circle r="17" class="ring"/><foreignObject x="-14" y="-14" width="28" height="28"><div xmlns="http://www.w3.org/1999/xhtml" class="av lg${t}" style="--s:28px;box-shadow:none"></div></foreignObject></g>`; });
  return s + `</svg><div class="dotinfo" id="kinfo">Tap a team. Across: wins their scoring earned. Up: wins beyond that.</div>`;
}
function swapList() {
  const t = S.swapT, x = T[t], rows = Object.entries(x.swap).sort((a, b) => b[1] - a[1]);
  return `<div class="list">` + rows.map(([u, w]) => { const d = w - x.w; return `<div class="item flat ${u === t ? "me" : ""}">${av(u, 32)}<span class="nm"><b>${u === t ? "Their real schedule" : esc(poss(T[u].short)) + " schedule"}</b></span><span class="val sm">${w}–${G - w}</span><em class="mv ${d > 0 ? "up" : d < 0 ? "dn" : ""}">${d ? sgn(d, 0) : "–"}</em></div>`; }).join("") + `</div>`;
}
function benchCases() {
  const cnt = {}; D.cases.forEach(c => cnt[c.t] = (cnt[c.t] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const names = l => l.map(p => `<span><b>${esc(p[0])}</b><small>${p[1]}</small><em>${f1(p[2])}</em></span>`).join("");
  return `<div class="tally">${top.map(([t, n]) => `<div class="ty t${t}">${av(t, 28)}<b>${sh(t)}</b><span class="dots">${Array.from({ length: n }, () => "<u></u>").join("")}</span><em>${n}</em></div>`).join("")}</div>
    <p class="dim cap">Games lost while a better lineup sat on the bench. Open a case for the details.</p><details class="allcases"><summary class="btn sm">All ${D.cases.length} cases</summary>` +
    D.cases.map(c => `<details class="case t${c.t}"><summary><span class="wk">Wk ${c.w}</span>${av(c.t, 26)}<span class="nm"><b>${nm(c.t)}</b><small>lost to ${nm(c.o)} by ${f1(c.margin)}</small></span></summary>
      <div class="cols"><div><h5>Benched</h5>${names(c.benched)}</div><div><h5>Started</h5>${names(c.started)}</div></div><p class="dim">Best possible lineup: ${f1(c.opt)}</p></details>`).join("") + `</details>`;
}
function lastPlace() {
  const rows = IDS.filter(t => T[t].lastp > 0.05).sort((a, b) => T[b].lastp - T[a].lastp);
  return `<div class="list">` + rows.map(t => `<button class="item t${t}" data-act="team" data-t="${t}">${av(t, 36)}<span class="nm"><b>${nm(t)}</b><small>${rec(t)}</small></span><span class="val">${pct(T[t].lastp)}</span></button>`).join("") + `</div>
    <h3 class="sub-h">What it costs</h3><div class="list">${D.pun.map(p => `<div class="item flat"><i>${p.year}</i><span class="nm"><b>${esc(p.who)}</b><small class="wrap">${esc(p.what)}</small></span></div>`).join("")}</div>`;
}
function viewLab() {
  return sec("Heat map", "Every score, every week", scoreGrid()) +
    sec("Luck", "Lucky or robbed", karmaSVG()) +
    sec("Schedule swap", "Whose schedule would you have won with?", picker(S.swapT, "swapT") + `<div id="swaplist">${swapList()}</div>`) +
    sec("Bench court", "Won it, then benched it", benchCases()) +
    sec("Bottom of the table", "Last place watch", lastPlace());
}

// ---------- registry + events ----------
const VIEWS = { scores: viewScores, race: viewRace, teams: viewTeams, legacy: viewLegacy, lab: viewLab };
const mark = (sel, v, key = "v") => $$(sel).forEach(b => b.classList.toggle("on", String(b.dataset[key]) === String(v)));
document.addEventListener("input", e => { if (e.target.id === "rng") { stopTick(); setScrub(+e.target.value); } });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case "story": { const [k, v] = D.stories[+d.i].go; if (k === "match") openMatch(G, v); else if (k === "team") openTeam(v); else go(v); break; }
    case "week": S.week = +d.w; mark("#weekchips button", d.w, "w"); $("#board").innerHTML = boardHTML(S.week); break;
    case "match": openMatch(+d.w, +d.i); break;
    case "sel": if (S.sel === d.t) { openTeam(d.t); break; } S.sel = d.t; applySel(); break;
    case "play": {
      const b = $("#play"); if (tick) { stopTick(); break; }
      b.classList.add("on"); if (S.scrub >= G) setScrub(1);
      tick = setInterval(() => { if (S.scrub >= G) { stopTick(); return; } setScrub(S.scrub + 1); }, 750); break;
    }
    case "team":
      if (S.compare && S.tab === "teams") {
        const i = S.cmp.indexOf(d.t); if (i >= 0) S.cmp.splice(i, 1); else S.cmp.push(d.t);
        if (S.cmp.length === 2) { const [a, b] = S.cmp; S.cmp = []; S.compare = false; go("teams", false); openTape(a, b); } else go("teams", false);
      } else openTeam(d.t);
      break;
    case "cmp": S.compare = !S.compare; S.cmp = []; go("teams", false); break;
    case "cmpfrom": openPicker(d.t); break;
    case "tape": openTape(d.a, d.b); break;
    case "tpane": S.pane = d.v; mark("#tseg button", d.v); $("#tbody").innerHTML = PANES[d.v](d.t); sbody.scrollTop = 0; break;
    case "dot": { const t = T[d.t], i = +d.i; $("#dotinfo").innerHTML = `Week ${i + 1} · <b>${f1(t.scores[i])}</b> vs ${nm(String(t.opp[i]))} · ${t.won[i] ? "Win" : "Loss"}`; break; }
    case "rec": S.recKey = d.k; mark("#recchips button", d.k, "k"); $("#reclist").innerHTML = recList(d.k); break;
    case "karma": {
      const x = T[d.t], e2 = (x.apw / (x.apw + x.apl)) * (x.w + x.l);
      $$(".kn").forEach(n => n.classList.toggle("sel", n.dataset.t === d.t));
      $("#kinfo").innerHTML = `<b>${nm(d.t)}</b> · ${x.w} wins, ${f1(e2)} earned · <b class="${x.luck > 0 ? "pos" : "neg"}">${sgn(x.luck)}</b>`; break;
    }
    case "swapT": S.swapT = d.t; mark(".tpick button", d.t, "t"); $("#swaplist").innerHTML = swapList(); break;
  }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("g[data-act]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
window.addEventListener("hashchange", () => go(location.hash.slice(1), false));
window.__app = { S, D, go, openTeam, openMatch, openTape };
go(location.hash.slice(1) || "scores", false);
})();
</script>
